<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Glowing circle background -->
  <circle cx="50" cy="50" r="48" fill="#141118" stroke="#d97706" stroke-width="3" />
  <circle cx="50" cy="50" r="44" fill="#1b1622" stroke="#78350f" stroke-width="1.5" stroke-dasharray="4 2" />
  
  <!-- D20 Die Outline in background -->
  <polygon points="50,15 80,32 80,68 50,85 20,68 20,32" stroke="#d97706" stroke-width="1.5" fill="#231c2b" opacity="0.6"/>
  <line x1="50" y1="15" x2="50" y2="85" stroke="#f59e0b" stroke-width="1" opacity="0.3"/>
  <line x1="20" y1="32" x2="80" y2="68" stroke="#f59e0b" stroke-width="1" opacity="0.3"/>
  <line x1="20" y1="68" x2="80" y2="32" stroke="#f59e0b" stroke-width="1" opacity="0.3"/>

  <!-- Tavern Tankard / Mug of Ale -->
  <!-- Mug body -->
  <path d="M34 38 L38 72 C38 75 42 77 50 77 C58 77 62 75 62 72 L66 38 Z" fill="#b45309" stroke="#f59e0b" stroke-width="2"/>
  <!-- Mug handle -->
  <path d="M64 44 C74 44 76 64 63 66" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <!-- Wooden barrel slats on mug -->
  <line x1="43" y1="40" x2="44" y2="74" stroke="#78350f" stroke-width="1.5"/>
  <line x1="57" y1="40" x2="56" y2="74" stroke="#78350f" stroke-width="1.5"/>
  <path d="M35 48 C43 51 57 51 65 48" stroke="#d97706" stroke-width="1.5" fill="none"/>
  <path d="M37 62 C44 65 56 65 63 62" stroke="#d97706" stroke-width="1.5" fill="none"/>

  <!-- Beer foam -->
  <path d="M31 38 C31 33 36 32 39 34 C41 30 48 30 50 33 C53 29 60 29 62 33 C66 32 69 35 68 39 C65 42 34 42 31 38 Z" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  <!-- Foam bubbles/drops -->
  <circle cx="37" cy="42" r="1.5" fill="#fef3c7"/>
  <circle cx="61" cy="44" r="1.5" fill="#fef3c7"/>
  <circle cx="50" cy="27" r="2" fill="#fef3c7"/>

  <!-- Crossed D&D Daggers / Swords behind foam -->
  <path d="M26 24 L34 32" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <path d="M74 24 L66 32" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
</svg>
